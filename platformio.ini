; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
monitor_speed = 115200
framework = arduino
lib_deps =
  m5stack/M5Unified
  gin66/FastAccelStepper
  fastled/FastLED
  teemuatlut/TMCStepper
; src/hwtest/ is the controller PCB test firmware; exclude it from the plotter.
build_src_filter =
  +<*>
  -<hwtest/>

[env:m5stack-core2-sim]
extends = env:m5stack-core2
build_flags =
  -DSIMULATION_MODE=1

; Controller PCB hardware test firmware (see tools/serial_tool/docs/hwtest-check.md).
; Reuses only the hardware driver modules; no planner/G-code/homing.
[env:m5stack-core2-hwtest]
extends = env:m5stack-core2
build_src_filter =
  -<*>
  +<hwtest/>
  +<TMC2209Manager.cpp>
  +<StepperBackendFastAccel.cpp>
  +<PenController.cpp>
  +<NeoPixelController.cpp>
