; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
monitor_speed = 115200
framework = arduino
test_ignore = native/*
lib_deps =
  m5stack/M5Unified
  gin66/FastAccelStepper
  fastled/FastLED
  teemuatlut/TMCStepper

[env:m5stack-core2-sim]
extends = env:m5stack-core2
build_flags =
  -DSIMULATION_MODE=1

; ホストPC上で純ロジック(kinematics/planner/segment)のテストを実行する。
; 実行: pio test -e native (WindowsではGCC/MinGWがPATHに必要)
[env:native]
platform = native
test_filter = native/*
test_build_src = yes
build_src_filter = -<*> +<CoreXYKinematics.cpp> +<SegmentGenerator.cpp> +<SegmentQueue.cpp> +<TrapezoidPlanner.cpp> +<JunctionPlanner.cpp> +<PlannerQueue.cpp> +<MotionSyncTracker.cpp>
build_flags =
  -std=c++17
  -DSIMULATION_MODE=1
  -I test/native
